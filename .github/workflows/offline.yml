name: offline

on:
  push:
  pull_request:

jobs:
  a-offline:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/A-mes-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install locked UI/runtime dependencies
        run: python -m pip install -r requirements-ui.lock.txt
      - name: Question offline regression
        run: python -B -m unittest discover -s tests -p "test_question*.py" -v
      - name: UI offline regression
        run: python -B -m unittest discover -s tests -p "test_ui*.py" -v
      - name: M5 intake offline regression
        run: python -B -m unittest discover -s tests -p "test_intake*.py" -v
      - name: V2 workspace offline regression
        run: python -B -m unittest discover -s tests -p "test_workspace*.py" -v
      - name: CLI offline demo (no key/DB)
        run: python -B -m mes_assistant.question_cli --request fixtures/m2/request.json --mode mock --script fixtures/m2/scripts/success.json --log ../../.test-tmp/ci-success.jsonl

  c-offline:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/C-eval-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: C offline regression
        run: python -B -m unittest discover -s tests -p "test_offline.py" -v
      - name: C live regression
        run: python -B -m unittest discover -s tests -p "test_intake_live_eval.py" -v
      - name: C v2 spec regression
        run: python -B -m unittest discover -s tests -p "test_v2_eval.py" -v
      - name: C export live inputs
        run: python -B -m evaluation.intake_live_eval --export-inputs --inputs ../../.test-tmp/live-inputs.json
      - name: C public intake CLI pending/test_double checks
        run: python -B tools/check_intake_public_cli.py
      - name: C intake offline judge
        run: python -B -m evaluation.intake_eval --mode both --output-dir ../../.test-tmp/c-intake
      - name: C legacy offline judge
        run: python -B -m ceval.cli --output-dir ../../.test-tmp/c-offline
